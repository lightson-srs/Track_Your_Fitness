<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Badminton player silhouette - colorful -->
  <!-- Head (orange) -->
  <circle cx="200" cy="115" r="28" fill="#f97316"/>
  <!-- Body/torso (blue) -->
  <path d="M200 143 L195 245" stroke="#3b82f6" stroke-width="22" stroke-linecap="round"/>
  <!-- Racket arm raised (red) -->
  <path d="M198 175 L270 110" stroke="#ef4444" stroke-width="16" stroke-linecap="round"/>
  <!-- Other arm (green) -->
  <path d="M197 200 L140 220" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
  <!-- Legs in lunge position (yellow + orange) -->
  <path d="M195 245 L145 345" stroke="#eab308" stroke-width="18" stroke-linecap="round"/>
  <path d="M145 345 L120 390" stroke="#eab308" stroke-width="14" stroke-linecap="round"/>
  <path d="M195 245 L265 330" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
  <path d="M265 330 L290 380" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>

  <!-- Badminton racket (red + white) -->
  <ellipse cx="300" cy="80" rx="35" ry="45" fill="none" stroke="#ef4444" stroke-width="8"/>
  <!-- Racket strings -->
  <line x1="300" y1="40" x2="300" y2="120" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="270" y1="80" x2="330" y2="80" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="275" y1="58" x2="325" y2="102" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <line x1="275" y1="102" x2="325" y2="58" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <!-- Racket handle connects to hand -->
  <path d="M270 110 L285 95" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

  <!-- Shuttlecock (multicolor) -->
  <circle cx="360" cy="50" r="10" fill="#ffffff"/>
  <path d="M360 60 L345 90" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 60 L355 92" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 60 L365 92" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 60 L375 90" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- Calendar/tracking element (bottom right) - multicolor -->
  <rect x="320" y="320" width="140" height="140" rx="18" fill="#ffffff"/>
  <!-- Calendar header (blue) -->
  <rect x="320" y="320" width="140" height="34" rx="18" fill="#3b82f6"/>
  <!-- Grid lines -->
  <line x1="344" y1="365" x2="344" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="368" y1="365" x2="368" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="392" y1="365" x2="392" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="416" y1="365" x2="416" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="440" y1="365" x2="440" y2="448" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="320" y1="390" x2="460" y2="390" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="320" y1="418" x2="460" y2="418" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Colored checkmarks in cells -->
  <path d="M328 376 L333 381 L341 371" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M352 376 L357 381 L365 371" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M376 376 L381 381 L389 371" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M400 376 L405 381 L413 371" stroke="#eab308" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M328 404 L333 409 L341 399" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M352 404 L357 409 L365 399" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M376 404 L381 409 L389 399" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M328 432 L333 437 L341 427" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M352 432 L357 437 L365 427" stroke="#eab308" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>